[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rotten-review"
version = "0.1.0"
description = "Review integrity pipeline: sentiment, score prediction and fake-review detection for movie reviews (EN/PL)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Jakub Arczewski" }]
dependencies = [
    "pandas>=2.0",
    "numpy>=1.24",
    "scikit-learn>=1.3",
    "duckdb>=0.10",
    "joblib>=1.3",
]

[project.optional-dependencies]
ingest = ["kagglehub>=0.2", "beautifulsoup4", "contractions", "nltk"]
embeddings = ["sentence-transformers>=2.2", "umap-learn>=0.5"]
app = ["gradio>=4.0"]
dbt = ["dbt-duckdb>=1.7"]
dev = ["pytest>=7.4", "ruff>=0.4"]

[project.scripts]
rotten-review = "rotten_review.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
exclude = ["notebooks"]
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
